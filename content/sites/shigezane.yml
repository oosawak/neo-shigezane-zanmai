about: このサイトは、伊達成実専門サイト「成実三昧」(管理人 TAKEMI Shigino、http://shigezane.info/)に掲載された資料を、同サイトのライセンス(クリエイティブ・コモンズ 表示-継承 2.1 日本、CC BY-SA 2.1 JP)に基づき、Markdown形式に変換して再構築したものです。出典は各記事に明記しています。第三者の方の寄稿テキスト・写真は転載せず、元ページへのリンクに置き換えています。カバー画像はAI(Muse)が作成したイラストです。
